<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c8a930" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c8a930" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#c8a930" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#glow)"/>
  <rect width="600" height="800" fill="url(#pulse)"/>
  <!-- Border -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#c8a930" stroke-width="1" opacity="0.3"/>
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#c8a930" stroke-width="0.5" opacity="0.15"/>
  <!-- Series label -->
  <text x="300" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#71717a" letter-spacing="4">SERIES 001 — THE SIGNAL</text>
  <!-- Frequency wave visualization -->
  <g opacity="0.6">
    <path d="M 60 350 Q 120 280 180 350 Q 240 420 300 350 Q 360 280 420 350 Q 480 420 540 350" fill="none" stroke="#c8a930" stroke-width="2" opacity="0.8"/>
    <path d="M 60 350 Q 120 300 180 350 Q 240 400 300 350 Q 360 300 420 350 Q 480 400 540 350" fill="none" stroke="#c8a930" stroke-width="1" opacity="0.4"/>
    <path d="M 60 350 Q 120 320 180 350 Q 240 380 300 350 Q 360 320 420 350 Q 480 380 540 350" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Concentric circles -->
  <circle cx="300" cy="350" r="60" fill="none" stroke="#c8a930" stroke-width="0.5" opacity="0.2"/>
  <circle cx="300" cy="350" r="100" fill="none" stroke="#c8a930" stroke-width="0.5" opacity="0.15"/>
  <circle cx="300" cy="350" r="140" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.1"/>
  <!-- Center dot -->
  <circle cx="300" cy="350" r="4" fill="#c8a930" opacity="0.8"/>
  <!-- Issue number -->
  <text x="300" y="160" text-anchor="middle" font-family="monospace" font-size="14" fill="#c8a930" letter-spacing="6" opacity="0.6">ISSUE 006</text>
  <!-- Title -->
  <text x="300" y="530" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#e8e8f0" letter-spacing="2">THE</text>
  <text x="300" y="580" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#e8e8f0" letter-spacing="2">FREQUENCY</text>
  <!-- Subtitle -->
  <text x="300" y="620" text-anchor="middle" font-family="monospace" font-size="11" fill="#c8a930" letter-spacing="2" opacity="0.7">The Hidden History of</text>
  <text x="300" y="640" text-anchor="middle" font-family="monospace" font-size="11" fill="#c8a930" letter-spacing="2" opacity="0.7">Electromagnetic Consciousness</text>
  <!-- Stats -->
  <text x="300" y="700" text-anchor="middle" font-family="monospace" font-size="9" fill="#71717a" letter-spacing="3">55 PAGES  ·  8 INVESTIGATIONS  ·  170 SOURCES</text>
  <!-- FractalNode branding -->
  <text x="300" y="750" text-anchor="middle" font-family="monospace" font-size="10" fill="#d4a020" letter-spacing="5" opacity="0.5">FRACTALNODE</text>
</svg>
